name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the extension zip to (e.g. v1.3.0)"
        required: true

permissions:
  contents: write
  actions: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: ./.github/actions/setup-blender

      - name: Build extension
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          sed -i -E "s/^version = .*/version = \"${BASH_REMATCH[1]}\"/" total_war_cs2_addon/blender_manifest.toml
          mkdir dist
          blender --background --factory-startup --command extension build \
            --source-dir total_war_cs2_addon --output-dir dist
          ls -l dist

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_path="$(ls dist/total_war_cs2_addon-*.zip)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip_path" --clobber
          else
            gh release create "$TAG" "$zip_path" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Refresh the extension repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
