name: Deploy docs to Wiki

on:
  push:
    branches: [main]
    paths:
      - "total_war_buildings/docs/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push docs to wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          cp total_war_buildings/docs/user_guide.html wiki/Home.html
          cd wiki
          git add Home.html
          if ! git diff --cached --quiet; then
            git commit -m "Sync docs from ${GITHUB_SHA}"
            git push
          fi
